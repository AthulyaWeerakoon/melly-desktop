<div class="files-app">
  <aside class="sidebar" aria-label="Places">
    <p class="sidebar-title">Places</p>
    <nav class="places"></nav>
  </aside>

  <section class="browser" aria-labelledby="folder-title">
    <div class="preview-banner" role="note">
      <span aria-hidden="true">ⓘ</span>
      Preview data only. Host files require a future permission-checked <code>melly.*</code> API.
    </div>
    <header class="toolbar">
      <div>
        <p class="path">Melly / <span class="path-location">Home</span></p>
        <h3 id="folder-title">Home</h3>
      </div>
      <button class="view-button" type="button" aria-pressed="false" title="Toggle compact view">
        Compact
      </button>
    </header>
    <div class="file-list" role="list" aria-label="Preview files"></div>
  </section>
</div>
