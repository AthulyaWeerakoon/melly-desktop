<section class="window" role="dialog" aria-labelledby="window-title" tabindex="-1">
  <header class="titlebar">
    <span class="window-icon" aria-hidden="true">•</span>
    <h2 id="window-title">Tool</h2>
    <div class="window-actions">
      <button class="maximize-button" type="button" aria-label="Maximize window" title="Maximize">□</button>
      <button class="close-button" type="button" aria-label="Close window" title="Close">×</button>
    </div>
  </header>
  <div class="window-content">
    <slot name="content"></slot>
  </div>
</section>
