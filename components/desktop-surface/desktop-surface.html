<section class="desktop-surface" aria-label="Active desktop">
  <div class="empty-state">
    <p class="eyebrow">Your programmable desktop</p>
    <h1>Make this space yours.</h1>
    <p class="introduction">
      Open an HTML-powered tool, switch desktop tabs, or launch a native application.
    </p>
    <div class="empty-actions">
      <button type="button" data-tool-id="files">Open Files</button>
      <button type="button" data-tool-id="settings">Open Settings</button>
      <button type="button" data-open-launcher>Browse apps</button>
    </div>
  </div>

  <melly-window-manager></melly-window-manager>
</section>
