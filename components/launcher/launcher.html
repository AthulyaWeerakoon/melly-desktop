<div class="backdrop">
  <section class="launcher" role="dialog" aria-modal="true" aria-labelledby="launcher-title">
    <header>
      <div>
        <p class="eyebrow">Applications</p>
        <h2 id="launcher-title">What do you need?</h2>
      </div>
      <button class="close-button" type="button" aria-label="Close launcher">×</button>
    </header>

    <label class="search">
      <span class="sr-only">Search applications</span>
      <span aria-hidden="true">⌕</span>
      <input type="search" autocomplete="off" placeholder="Search applications…">
    </label>

    <ul class="application-list" aria-label="Applications"></ul>
    <p class="empty-state" hidden>No matching applications.</p>
  </section>
</div>
